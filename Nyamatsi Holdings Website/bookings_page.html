<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking - Nyamatsi Holdings</title>
  <link rel="stylesheet" href="bookings_stylesheet.css" />
</head>
<body>
  <div class="page-wrapper">

    <!-- HEADER -->
    <div class="header">
      <div class="logo">
        <center><img src="images/Full_Logo.png" alt="Logo" width="140px" /></center>
      </div>
      <div class="nav">
        <ul>
          <li><a href="homepage.html">Home</a></li>
          <li><a href="about_page.html">About</a></li>
          <li><a href="contact_page.html">Contact</a></li>
        </ul>
      </div>
    </div>

    <!-- BOOKING FORM ON BACKGROUND -->
    <div class="background-section">
      <div class="booking-container">
        <h1>Book an Appointment</h1>
        <form class="booking-form">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required />

          <label for="phone">Cell Phone Number</label>
          <input type="tel" id="phone" name="phone" required />

          <label for="address">Service Address</label>
          <input type="text" id="address" name="address" required />

          <label for="date">Preferred Date</label>
          <input type="date" id="date" name="date" required />

          <label for="description">Additional Information</label>
          <textarea id="description" name="description" rows="4" placeholder="Include any details..."></textarea>

          <button type="submit">Submit Booking</button>
        </form>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <p>&copy; 2025 Nyamatsi Holdings. All rights reserved.</p>
    </div>

  </div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.querySelector(".booking-form");

    form.addEventListener("submit", function (event) {
      event.preventDefault(); // Prevent page refresh

      // Optionally validate again here if needed

      // Display confirmation message
      alert("Your booking has been submitted. We will get back to you soon!");

      // Clear the form fields
      form.reset();
    });
  });
</script>


</body>
</html>
